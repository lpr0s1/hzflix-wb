<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>Viewer live</title>
</head>

<body class="bg-black text-white p-6 space-y-4">

<video id="video" autoplay playsinline class="rounded-xl"></video>

<textarea id="offer" class="w-full h-40 bg-zinc-900 p-4 rounded-xl"
placeholder="Coller SDP diffuseur"></textarea>

<textarea id="answer" class="w-full h-40 bg-zinc-900 p-4 rounded-xl"
placeholder="Réponse à renvoyer"></textarea>

<button id="connect" class="bg-blue-600 px-6 py-3 rounded-xl">
Se connecter
</button>

<script>
const pc = new RTCPeerConnection();
const video = document.getElementById("video");

pc.ontrack = e => video.srcObject = e.streams[0];

pc.onicecandidate = e => {
  if (!e.candidate) {
    answer.value = JSON.stringify(pc.localDescription);
  }
};

document.getElementById("connect").onclick = async () => {
  const off = JSON.parse(offer.value);
  await pc.setRemoteDescription(off);

  const ans = await pc.createAnswer();
  await pc.setLocalDescription(ans);
};
</script>

</body>
</html>
