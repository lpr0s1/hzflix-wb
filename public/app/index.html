<!doctype html>
<html lang="fr" translate="no">
<head>
<meta http-equiv="Content-Type" content="text/html;charset=UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="velocity">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json" id="manifestLink">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
<title>Velocity One</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
html,body{
  margin:0;height:130%;
  background:radial-gradient(1200px 600px at center,#05091f,#02030d 70%);
  display:flex;align-items:center;justify-content:center;
  font-family:Inter,system-ui,-apple-system,Roboto;
  color:white;
  overflow:hidden
}
.container{
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
  position:relative
}
.gauge{
  display:flex;align-items:center;gap:6vw
}
.tri-bar{
  width:80px;height:78vh;
  display:flex;flex-direction:column-reverse;
  gap:6px;padding:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));
  clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);
  border-radius:22px;
  box-shadow:0 40px 80px rgba(0,0,0,.7),inset 0 0 30px rgba(255,255,255,.04)
}
.tri-seg{
  height:16px;width:135%;
  clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);
  background:rgba(255,255,255,.05);
  transition:background .15s,opacity .15s,box-shadow .15s
}
.center{
  width:300px;text-align:center;
  display:flex;flex-direction:column;align-items:center
}
.speed{
  font-size:52vw;max-width:300px;
  font-weight:900;
  letter-spacing:-.04em;
  line-height:.85;
  transition:color .2s,transform .2s
}
.unit{
  font-size:22px;font-weight:700;
  opacity:.85;margin-top:-10px
}
.preview{
  margin-top:26px;
  padding:12px 26px;
  border-radius:999px;
  font-weight:800;
  letter-spacing:.04em;
  background:linear-gradient(135deg,#0ea5e9,#22d3ee);
  color:#020617;
  box-shadow:0 18px 40px rgba(34,211,238,.35);
  transition:transform .15s,box-shadow .15s,opacity .15s
}
.preview:hover{
  transform:translateY(-2px);
  box-shadow:0 26px 60px rgba(34,211,238,.45)
}
.glow{
  position:absolute;
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(0,255,255,.12),transparent 60%);
  filter:blur(40px);
  z-index:-1
}
.notice{
  position:absolute;bottom:30px;
  padding:12px 20px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  font-weight:700;
  backdrop-filter:blur(12px)
}
#btnGeo{
  position:absolute;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 24px;
  border-radius:999px;
  font-weight:700;
  background:linear-gradient(135deg,#0ea5e9,#22d3ee);
  color:#020617;
  box-shadow:0 12px 30px rgba(34,211,238,.4);
  cursor:pointer;
  z-index:10;
}
#btnGeo:hover{
  transform:translate(-50%,-2px);
  box-shadow:0 18px 40px rgba(34,211,238,.45);
}
</style>
</head>

<body>
<div class="container">
  <div class="glow"></div>

  <div class="gauge">
    <div id="left" class="tri-bar"></div>

    <div class="center">
      <div id="speed" class="speed">0</div>
      <div class="unit">km/h</div>
      <button id="preview" class="preview" style="opacity: 0;">PREVIEW</button>
    </div>

    <div id="right" class="tri-bar"></div>
  </div>

  <div id="notice" class="notice">Activation de la géolocalisation…</div>
  <button id="btnGeo">Activer la géolocalisation</button>
</div>

<script>
const MAX=90, SEGS=29;
const speedEl=document.getElementById("speed");
const left=document.getElementById("left");
const right=document.getElementById("right");
const notice=document.getElementById("notice");
const preview=document.getElementById("preview");
const btnGeo=document.getElementById("btnGeo");
let last=null, sim=false;

function seg(bar){
  for(let i=0;i<SEGS;i++){
    const d=document.createElement("div");
    d.className="tri-seg";
    bar.appendChild(d);
  }
}
seg(left); seg(right);

function col(p){
  const r=Math.round(255*p);
  const g=Math.round(200*(1-p));
  return `rgb(${r},${g},80)`;
}

function bars(v){
  const l=Math.floor(Math.min(1,v/MAX)*SEGS);
  [left,right].forEach(b=>{
    [...b.children].forEach((s,i)=>{
      const a=i<l;
      s.style.background=a?col(i/SEGS):"rgba(255,255,255,.05)";
      s.style.opacity=a?1:.25;
      s.style.boxShadow=a?"0 0 12px rgba(255,120,0,.4)":"none";
    })
  })
}

function draw(v){
  speedEl.textContent=Math.round(v);
  speedEl.style.color=col(Math.min(1,v/MAX));
  speedEl.style.transform=`scale(${1+v/600})`;
  bars(v);
}

function dist(a,b){
  const R=6371e3;
  const p1=a.coords.latitude*Math.PI/180;
  const p2=b.coords.latitude*Math.PI/180;
  const dP=p2-p1;
  const dL=(b.coords.longitude-a.coords.longitude)*Math.PI/180;
  const x=Math.sin(dP/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dL/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
btnGeo.addEventListener('click', () => {
  if(!navigator.geolocation){
    notice.textContent = "Géolocalisation non supportée";
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (position)=>{
      notice.style.display="none";
      last = position;

      navigator.geolocation.watchPosition(
        (p)=>{
          if(sim) return;
          let s = p.coords.speed;
          if(s==null && last){
            s = dist(last,p)/((p.timestamp-last.timestamp)/1000);
          }
          draw(s*3.6);
          last = p;
        },
        ()=>{
          notice.textContent = "Géolocalisation requise";
        },
        { enableHighAccuracy:true }
      );
    },
    (err)=>{
      notice.textContent = "Permission géolocalisation refusée";
      console.warn(err);
    },
    { enableHighAccuracy:true }
  );

  btnGeo.style.display = 'none';
});

preview.onclick=()=>{
  if(sim) return;
  sim=true;
  let v=0;
  const i=setInterval(()=>{
    v+=4;
    draw(v);
    if(v>=MAX){
      clearInterval(i);
      sim=false;
    }
  },60);
}
</script>
</body>
</html>
