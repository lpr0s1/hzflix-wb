<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ANTI PEDO NETWORK</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.14"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Silkscreen"; -webkit-user-select: none;}
body{display:flex;flex-direction:column;min-height:100vh;background:#05000a;color:#ff003c;transition:background 0.3s;}
header{padding:12px;text-align:center;font-size:22px;letter-spacing:2px;text-shadow:0 0 12px #ff003c;background:#080010;}
#app{flex:1;padding:12px;max-width:900px;margin:auto;width:100%;display:flex;flex-direction:column;}
input,textarea,button{width:100%;margin-top:6px;}
button{background:#ff003c;color:black;border:none;padding:10px;font-family:"Silkscreen";cursor:pointer;border-radius:6px;box-shadow:0 0 12px #ff003c;transition:0.2s;}
button:active{transform:scale(.96);}
input,textarea{background:#0a0014;color:#ff003c;border:1px solid #ff003c;padding:8px;border-radius:6px;}
.panel{border:1px solid #ff003c;padding:10px;margin-top:10px;box-shadow:0 0 12px #ff003c;background:#080010;border-radius:8px;transition:0.3s;}
.chat-container{display:flex;flex-direction:row;gap:10px;}
.chatbox{flex:1;height:300px;overflow-y:auto;border:1px solid #ff003c;padding:10px;border-radius:6px;background:#0f001f;}
.message{color:#00ffd5;margin-bottom:6px;font-size:13px;}
.quest-container{width:280px;display:flex;flex-direction:column;gap:20px;}
.quest{border:1px solid #00ffd5;padding:8px;border-radius:6px;background:#0f001f;font-size:13px; animation: vj 0.7s infinite;}
@keyframes vj{
  0%{color: red}
  50%{color: blue}
  70%{color: greenyellow}
  100%{color: red}
}
.voteRow{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:6px; animation: ks 2s infinite;}
@keyframes ks{
  0%{text-shadow: 0px 0px 0px black}
  30%{text-shadow: 0px 0px 20px red}
  50%{text-shadow: 0px 0px 16px yellow}
  70%{text-shadow: 0px 0px 20px orange}
  100%{text-shadow: 0px 0px 0px black}
}
.settings-popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:100;display:none;}
.settings-popup.active{display:flex;}
.settings-content{background:#080010;padding:20px;border:1px solid #00ffd5;border-radius:8px;position:relative;width:300px;}
.settings-content .close{position:absolute;top:8px;right:8px;cursor:pointer;font-size:16px;color:#ff003c;}
.glow{animation:glow 1.4s infinite alternate;}
@keyframes glow{from{text-shadow:0 0 6px #ff003c}to{text-shadow:0 0 18px #00ffd5}}
.timer{font-size:11px;color:#ff77aa;margin-top:4px;}
</style>
</head>
<body>
  <br>
  <br>
<header class="glow">ANTI PEDO NETWORK</header>
<p style="color: red">Le réseaux anti pédophile. 100% anonyme <b style="color: blue">2026</b></p>
<div id="app">
<div v-if="!loaded" style="text-align:center;padding:20px;">Chargement…</div>

<div v-else>
<div v-if="!username">
<h2>Identité</h2>
<input v-model.trim="tempName" placeholder="Ton pseudo">
<button @click="login">Connexion</button>
<div v-if="errorMsg" style="color:#ff0044;margin-top:6px">{{errorMsg}}</div>
</div>

<div v-else>
<div class="chat-container">
<div class="panel chatbox">
<h3>Chat Global</h3>
<div class="chatbox-inner" ref="chat">
<div v-for="m in messages" :key="m.id" class="message">
<b>{{m.username}}</b> : {{m.content}}
</div>
</div>
<input v-model.trim="newMessage" placeholder="Message..." @keyup.enter="sendMessage">
<button @click="sendMessage"><i class="fa fa-paper-plane"></i></button>
</div>

<div class="quest-container">
<h3>Quêtes</h3>
<input v-model.trim="questTitle" placeholder="Titre">
<textarea v-model.trim="questDesc" placeholder="Description"></textarea>
<button @click="publishQuest"><i class="fa fa-plus"></i> Ajouter</button>

<div v-for="q in quests" :key="q.id" class="quest">
<h4>{{q.title}}</h4>
<p>{{q.description}}</p>
<div class="voteRow">
<div>
<button @click="voteUp(q)"><i class="fa fa-thumbs-up"></i></button>
<button @click="voteDown(q)"><i class="fa fa-thumbs-down"></i></button>
</div>
<div>{{q.upvotes}} / {{q.downvotes}}</div>
</div>
<div class="timer">{{questTimer(q.created_at)}}</div>
</div>
</div>
</div>

<button @click="toggleSettings" style="margin-top:10px;"><i class="fa fa-cog"></i> Paramètres</button>

<div :class="{'settings-popup':true,'active':showSettings}">
<div class="settings-content">
<div class="close" @click="toggleSettings"><i class="fa fa-times"></i></div>
<label>Couleur de fond :</label>
<input type="color" v-model="bgColor" @change="changeBgColor">
</div>
</div>

</div>
</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient("https://ipxzpixgpetvuvwajpxi.supabase.co","sb_publishable_YrC_vtyQyh9VhSx8C6OeuA_FKzFya2m")

function escapeHtml(str){return str.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

new Vue({
el:"#app",
data:{
username:"",
tempName:"",
messages:[],
newMessage:"",
quests:[],
questTitle:"",
questDesc:"",
loaded:false,
errorMsg:"",
showSettings:false,
bgColor:"#05000a"
},
async mounted(){
this.username = this.getCookie("username") || ""
await this.fetchData()
setInterval(this.fetchData,5000)
document.body.style.backgroundColor = this.bgColor
},
methods:{
getCookie(name){let match=document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));return match?decodeURIComponent(match[2]):""},
setCookie(name,value,days=365){let d=new Date();d.setTime(d.getTime()+(days*24*60*60*1000));document.cookie=name+"="+encodeURIComponent(value)+";path=/;expires="+d.toUTCString()},
async fetchData(){
try{
const { data: m } = await supabase.from("messages").select("*").order("created_at",{ascending:true})
this.messages=m||[]
const { data: q } = await supabase.from("quests").select("*").order("created_at",{ascending:false})
this.quests=q||[]
this.loaded=true
this.$nextTick(()=>this.$refs.chat.scrollTop=this.$refs.chat.scrollHeight)
}catch(e){console.error(e)}
},
async login(){
if(!this.tempName){this.errorMsg="Pseudo requis";return}
const { data: users } = await supabase.from("messages").select("username").eq("username",this.tempName)
if(users.length>0){this.errorMsg="Pseudo déjà utilisé";return}
this.username=this.tempName
this.setCookie("username",this.username)
this.errorMsg=""
},
async sendMessage(){
if(!this.newMessage)return
await supabase.from("messages").insert({username:escapeHtml(this.username),content:escapeHtml(this.newMessage)})
this.newMessage=""
await this.fetchData()
},
async publishQuest(){
if(!this.questTitle||!this.questDesc)return
await supabase.from("quests").insert({title:escapeHtml(this.questTitle),description:escapeHtml(this.questDesc),upvotes:0,downvotes:0,created_at:new Date().toISOString()})
this.questTitle=""
this.questDesc=""
await this.fetchData()
},
async voteUp(q){
let voted = this.getCookie("votedQuests") || ""
let votedIds = voted ? voted.split(",") : []
if(votedIds.includes(q.id.toString())) return
await supabase.from("quests").update({upvotes:q.upvotes+1}).eq("id",q.id)
votedIds.push(q.id)
this.setCookie("votedQuests",votedIds.join(","))
await this.fetchData()
},
async voteDown(q){
let voted = this.getCookie("votedQuests") || ""
let votedIds = voted ? voted.split(",") : []
if(votedIds.includes(q.id.toString())) return
await supabase.from("quests").update({downvotes:q.downvotes+1}).eq("id",q.id)
votedIds.push(q.id)
this.setCookie("votedQuests",votedIds.join(","))
await this.fetchData()
},
toggleSettings(){this.showSettings=!this.showSettings},
changeBgColor(){document.body.style.backgroundColor=this.bgColor;this.setCookie("bgColor",this.bgColor)},
questTimer(created_at){
let diff=Math.floor((Date.now()-new Date(created_at))/1000)
let remain=3600-diff
if(remain<=0)return "Expirée"
let m=Math.floor(remain/60),s=remain%60
return `${m}m ${s}s restants`
}
}
})
</script>
</body>
</html>
