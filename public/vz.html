<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Détection d'objets YOLO avec Webcam</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
html, body { margin:0; padding:0; overflow:hidden; }
video, canvas { position:absolute; top:0; left:0; width:100vw; height:100vh; object-fit:cover; }
#controls { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:10; }
button { padding:8px 12px; margin: 0 4px; font-size:16px; }
</style>
</head>
<body>

<div id="controls">
  <button id="switchCamera">Changer caméra</button>
  <button id="zoomIn">+</button>
  <button id="zoomOut">-</button>
</div>

<video id="webcam" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

<script>
const video = document.getElementById("webcam");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

let session = null;
let usingFront = true;
let zoom = 1;

const modelUrl = "model/yolov8n.onnx"; // modèle YOLOv8 ONNX (directement téléchargeable)

async function setupCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: usingFront ? "user" : "environment" }
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

async function loadModel() {
  session = await ort.InferenceSession.create(modelUrl);
  console.log("Modèle chargé :", session);
}

function preprocess(image) {
  const off = document.createElement("canvas");
  off.width = 640;
  off.height = 640;
  const ctxOff = off.getContext("2d");
  ctxOff.drawImage(image, 0, 0, 640, 640);
  const imgData = ctxOff.getImageData(0,0,640,640);
  const data = Float32Array.from(imgData.data).map(v => v / 255);
  return new ort.Tensor("float32", data, [1, 3, 640, 640]);
}

async function detectFrame() {
  if (!session || video.readyState !== 4) {
    requestAnimationFrame(detectFrame);
    return;
  }

  const inputTensor = preprocess(video);
  const feeds = { images: inputTensor };
  const results = await session.run(feeds);

  // format typique YOLOv8 ONNX : boxes + scores + classes
  const boxes = results.boxes.data;
  const scores = results.scores.data;
  const classes = results.classes.data;

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  if (usingFront) { ctx.translate(canvas.width, 0); ctx.scale(1,1); }
  ctx.scale(zoom, zoom);

  const threshold = 0.3;
  for (let i=0; i<scores.length; i++) {
    if (scores[i] > threshold) {
      const idx = i*4;
      const [cx, cy, w, h] = [
        boxes[idx], boxes[idx+1], boxes[idx+2], boxes[idx+3]
      ];
      const x = cx - w/2, y = cy - h/2;

      ctx.strokeStyle = "#00FF00";
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = "#00FF00";
      ctx.fillText(classes[i].toString(), x, y - 5);
    }
  }

  ctx.restore();
  requestAnimationFrame(detectFrame);
}

document.getElementById("switchCamera").onclick = async () => {
  usingFront = !usingFront;
  await setupCamera();
};

document.getElementById("zoomIn").onclick = () => zoom = Math.min(zoom+0.1, 3);
document.getElementById("zoomOut").onclick = () => zoom = Math.max(zoom-0.1, 0.5);

Promise.all([setupCamera(), loadModel()]).then(() => detectFrame());
</script>

</body>
</html>
