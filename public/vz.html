<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Hand Tracking & Counting</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
#controls { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; }
button { padding: 10px 14px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
button:hover { background: #0056b3; }
video, canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
#label { position: absolute; top: 60px; left: 10px; color: white; font-size: 24px; z-index: 10; }
</style>
</head>
<body>

<div id="controls">
  <button id="switchCamera">Changer caméra</button>
</div>

<video id="webcam" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>
<div id="label">Passages de main fermée : 0</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const labelText = document.getElementById('label');

let detector = null;
let usingFront = true;
let countClosed = 0;
let wasOpen = false;

// Setup camera
async function setupCamera() {
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: usingFront ? 'user' : 'environment' }
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
}

// Initialize MediaPipe Hands detector
async function initDetector() {
    const model = handPoseDetection.SupportedModels.MediaPipeHands;
    detector = await handPoseDetection.createDetector(model, {
        runtime: 'mediapipe',
        solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands',
        modelType: 'full'
    });
}

// Determine if hand is closed (simple heuristic)
function isHandClosed(keypoints) {
    // Vérifier distance entre le poignet et les pointes des doigts (index, majeur, annulaire, etc.)
    const wrist = keypoints[0];
    const fingerTips = [8, 12, 16, 20].map(i => keypoints[i]);
    let avgDistance = 0;
    fingerTips.forEach(tip => {
        avgDistance += Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
    });
    avgDistance /= fingerTips.length;
    // Si les doigts sont proches du poignet, main fermée (valeur empirique)
    return avgDistance < 60;
}

// Draw landmarks and bounding box
function drawResults(hands) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#00FF00';
    ctx.lineWidth = 3;
    ctx.fillStyle = 'white';
    hands.forEach(hand => {
        const keypoints = hand.keypoints;
        const xs = keypoints.map(p => p.x);
        const ys = keypoints.map(p => p.y);
        const minX = Math.min(...xs);
        const maxX = Math.max(...xs);
        const minY = Math.min(...ys);
        const maxY = Math.max(...ys);
        ctx.strokeRect(minX, minY, maxX - minX, maxY - minY);
        keypoints.forEach(p => ctx.fillRect(p.x - 3, p.y - 3, 6, 6));
    });
}

// Main loop
async function detectLoop() {
    if (!detector || video.readyState !== 4) {
        requestAnimationFrame(detectLoop);
        return;
    }
    const hands = await detector.estimateHands(video, { flipHorizontal: usingFront });
    if (hands.length > 0) {
        const closed = isHandClosed(hands[0].keypoints);
        if (closed && !wasOpen) {
            countClosed++;
            labelText.textContent = `Passages de main fermée : ${countClosed}`;
        }
        wasOpen = !closed;
    }
    drawResults(hands);
    requestAnimationFrame(detectLoop);
}

document.getElementById('switchCamera').onclick = async () => {
    usingFront = !usingFront;
    await setupCamera();
};

(async () => {
    await setupCamera();
    await initDetector();
    detectLoop();
})();
</script>

</body>
</html>
