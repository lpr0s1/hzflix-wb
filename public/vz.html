<!DOCTYPE html>
<html>
<head>
    <title>Détection d'objets et visages iOS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.9.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-detection@0.0.7/dist/face-detection.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; }
        video { position: absolute; top: 0; left: 0; transform: scaleX(-1); }
    </style>
</head>
<body>
    <video id="webcam" autoplay muted playsinline width="640" height="480"></video>
    <canvas id="overlay" width="640" height="480"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            return new Promise(resolve => {
                video.onloadedmetadata = () => { resolve(video); };
            });
        }

        async function detectObjects(cocoModel, faceModel) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Détection d'objets
            const predictions = await cocoModel.detect(video);
            predictions.forEach(pred => {
                const [x, y, width, height] = pred.bbox;
                ctx.strokeStyle = '#00FF00';
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, width, height);
                ctx.font = '18px Arial';
                ctx.fillStyle = '#00FF00';
                ctx.fillText(`${pred.class} (${Math.round(pred.score * 100)}%)`, x, y > 20 ? y - 5 : y + 20);
            });

            // Détection de visages
            const faces = await faceModel.estimateFaces({ input: video });
            faces.forEach(face => {
                const { topLeft, bottomRight } = face.boundingBox;
                const [x1, y1] = topLeft;
                const [x2, y2] = bottomRight;
                ctx.strokeStyle = '#FF0000';
                ctx.lineWidth = 3;
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
                ctx.font = '18px Arial';
                ctx.fillStyle = '#FF0000';
                ctx.fillText(`Visage`, x1, y1 > 20 ? y1 - 5 : y1 + 20);
            });

            requestAnimationFrame(() => detectObjects(cocoModel, faceModel));
        }

        async function main() {
            await setupCamera();
            const cocoModel = await cocoSsd.load();
            const faceModel = await faceDetection.createDetector(faceDetection.SupportedModels.MediaPipeFaceDetector, {
                runtime: 'tfjs',
                maxFaces: 5
            });
            detectObjects(cocoModel, faceModel);
        }

        main();
    </script>
</body>
</html>
