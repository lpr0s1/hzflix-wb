<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Détection OBJETS & VISAGES | ml5.js</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
html, body { margin:0; padding:0; overflow:hidden; touch-action:none; background:#000;}
#controls { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:8px; }
button { padding:10px 14px; font-size:16px; background:#007bff; color:white; border:none; border-radius:5px; }
button:hover { background:#0056b3; }
video, canvas { position:absolute; top:0; left:0; width:100vw; height:100vh; object-fit:cover; }
</style>
</head>
<body>

<div id="controls">
  <button id="switchCamera">Changer caméra</button>
  <button id="zoomIn">+</button>
  <button id="zoomOut">-</button>
</div>

<video id="webcam" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ml5/0.12.2/ml5.min.js"></script>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');

let detector;
let usingFrontCamera = true;
let zoomFactor = 1;

// Setup caméra
async function setupCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: usingFrontCamera ? 'user' : 'environment' }
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

// Détection et dessin
function detectAndDraw() {
  if (!detector || video.readyState !== 4) {
    requestAnimationFrame(detectAndDraw);
    return;
  }

  detector.detect(video, (err, results) => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(zoomFactor, zoomFactor);

    if (results) {
      results.forEach(obj => {
        const { x, y, width, height, label } = obj;

        // boîte autour
        ctx.strokeStyle = '#00FF00';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, width, height);

        // label
        ctx.font = '20px Arial';
        ctx.fillStyle = '#00FF00';
        ctx.fillText(label, x, y > 20 ? y - 5 : y + 20);
      });
    }
    ctx.restore();
  });

  requestAnimationFrame(detectAndDraw);
}

// Initialisation du modèle
async function startDetection() {
  detector = await ml5.objectDetector('cocossd');
  detectAndDraw();
}

// Boutons
document.getElementById('switchCamera').addEventListener('click', async () => {
  usingFrontCamera = !usingFrontCamera;
  await setupCamera();
});

document.getElementById('zoomIn').addEventListener('click', () => {
  zoomFactor = Math.min(zoomFactor + 0.1, 3);
});

document.getElementById('zoomOut').addEventListener('click', () => {
  zoomFactor = Math.max(zoomFactor - 0.1, 0.5);
});

// Démarrage
(async () => {
  await setupCamera();
  startDetection();
})();
</script>

</body>
</html>
