<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Remote tools</title>
  </head>
  <body>
    
    <style>
      .inpt{
        background-color: transparent;
        color: white;
      }
      u:hover{
        color: red;
      }
    </style>
    
    <h2 style="font-size: 29px; color: red; text-shadow: 0px 0px 20px red">Connectez vous a des cameras ip.</h2>
    <center>
      <small style="color: white; text-shadow: 0px 0px 24px red">Adresse de la camera ip, port possible : (80/8080/443)</small>
    <input id="inpt" class="inpt" style="width: 70%; border-radius: 6px; border: solid 2px red; padding: 10px 30px; font-size: 18px;" type="url" placeholder="ex: http://0.0.0.0" required>
    <input id="port" class="inpt" style="width: 70%; border-radius: 6px; border: solid 2px red; padding: 10px 30px; font-size: 18px;" type="text" placeholder="port: 80, 8080, ou 443">
    </center>
    <br>
   
    <button id="btconnex" class="connex" onclick="chargement()">Connexion</button>
    </div>
      <center>
    <span id="ad" style="font-size: 29px; color: green; text-shadow: 0px 0px 8px green"></span>
    <progress class="chrg" id="vk" value="0" max="100"></progress>
  </center>
    <br>
    <br>
    <br><div style="display: flex">
    <label id="kst" style="color: white" for="chk">Afficher des IP cam public</label>
    <i id="arow" style="color: white;" class="material-icons">expand_more</i>
    </div>
    <input id="chk" type="checkbox" style="display: none;">
    <br>
    <div id="conten" style="border: solid 3px red; width: 80%; border-radius: 9px; padding: 10px 20px; overflow-y: auto; height: 52px;">
      <small style="color: white">Scrollez pour tout voir.</small>
      <small style="color: red">Toucher une ip pour la coller directement.</small>
      <p style="color: white;" onclick="adp()"><u>110.42.231.125 | États-Unis</u><i class="material-icons">videocam</i></p>
      <p style="color: white;" onclick="adp2()"><u>50.222.183.105 | États-Unis</u><i class="material-icons">videocam</i></p>
    
    </div>
    

    
    <script>
    var bgt = document.getElementById("chk");
    var ctn = document.getElementById("conten");
    var kvx = document.getElementById("kst");
    var bxar = document.getElementById("arow");
    
    ctn.style.transition = "all 0.3s ease";
    ctn.style.filter = "blur(8px)"
    ctn.style.opacity = "0";
      ctn.style.transform = "scale(0)";
    
    bgt.addEventListener("click", () => {
      ctn.style.transform = bgt.checked ? "scale(1.0)" : "scale(0)";
      ctn.style.opacity = bgt.checked ? "1" : "0";
      ctn.style.transform = bgt.checked ? "translateX(4px)" : "translateX(0px)"
      bxar.style.transform = bgt.checked ? "rotate(180deg)" : "rotate(0deg)"
      
      kvx.innerText = bgt.checked ? "Masquer les IP cam public" : "Afficher des IP cam public"
      ctn.style.filter = bgt.checked ? "blur(0px)" : "blur(8px)"
      kvx.style.transition = "all 0.3s ease";
      bxar.style.transition = "all 0.3s ease"
      ctn.style.transition = "all 0.3s ease";
    })
      
    </script>
    <br>
    <style>
    body{
      width: 95%;
      margin: 15;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      background: linear-gradient(90deg, black, #333);
    }
    .connex{
      font-weight: bold;
      padding: 10px 40px;
      width: 95%;
      border-radius: 5px;
      color: red;
      font-size: 19px;
      background-color: black;
      border: solid 3px red;
      text-shadow: 0px 0px 14px red;
      box-shadow: 0px 0px 26px red;
    }
    
    progress{
      appearance: none;
      border-radius: 8px;
    }
    progress::-webkit-progress-bar {
  background-color: transparent;
    }
      .chrg{
        height: 30px;
        background-color: transparent;
        width: 90%;
      }
      .lgs{
        content: "";
      }
      
      .lgs:after{
        content: "";
        animation: blp 1s infinite;
      }
      
      @keyframes blp{
        0%{content: "."}
        50%{content: ".."}
        100%{content: "..."}
      }
      
      .clogs{
        margin-top: -10px;
        margin-left: -10px;
      }
      
      .clogs:after{
        content: "/";
        animation: jxv 2s infinite;
      }
      
      @keyframes jxv{
        0%{content: "/"}
        30%{content: "-"}
        60%{content: "\\"}
        100%{content: "/"}
      }
    </style>
    <b class="lgs" style="color: lightgrey; text-shadow: 0px 0px 10px red;"><i>Logs</i></b>
    <div style="color: white; overflow-x: auto; height: 100px; background-color: black; padding: 10px 28px; box-shadow: 0px 0px 50px red; border-radius: 7px;" id="logs"><p class="clogs"></p></div>
    
  
    <script>
      var a = document.getElementById("ad");
      var xb = document.getElementById("vk");
      var btco = document.getElementById("btconnex");
      
      xb.style.display = "none";
      a.style.display = "none";
      
   function chargement(){
     
     const inptk = document.getElementById("inpt").value;
     document.getElementById("vix").src = inptk;
     document.getElementById("vie").src = inptk;
     var j = document.getElementById("vie")
     var bn = document.getElementById(vix)
     var pi = document.getElementById("logs")
     
     
     
     if (inptk === "") {
  alert("Vous n avez mis aucune adresse !")
  return;
}
      var o = 0;
      btco.style.display = "none";
      xb.style.display = "block";
a.style.display = "block";

const timer = setInterval(function() {
  a.textContent = o + "%";
  xb.value = o;
  o++;
  
  if (o > 100) {
    clearInterval(timer);
    btco.style.display = "block";
    xb.style.display = "none";
    a.style.display = "none";
    pi.innerHTML += "Lecteurs | source=" + inptk + "<br>";
  }
}, 20);
}
    </script>
    <br>
    <br>
    <br>
    <fieldset style="border: solid 2px white; border-radius: 5px">
      <legend style="color: red"><b>Les lecteurs:</b></legend>
    <iframe id="vix" width="340" height="250"></iframe>
    
      <div class="frame">
    <img id="vie" alt="Live camera">
  </div>
<style>
  .frame {
  padding: 14px;
  border-radius: 12px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .6);
}

.frame img {
  color: red;
  width: 95%;
  height: 240px;
  border-radius: 8px;
  display: block;
}
</style>
    
        <script>
        document.getElementById("port").value;
        
        port.value = "80"
        
      function adp() {
        document.getElementById("inpt").value = "http://110.42.231.125:" + port.value;
      }
      function adp2() {
  document.getElementById("inpt").value = "http://50.222.183.105:" + port.value;
}
    </script>
    
    
  </body>
</html>
