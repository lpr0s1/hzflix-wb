<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Diffuseur écran</title>
</head>

<body class="bg-black text-white p-6 space-y-4">
  
  <button id="start" class="bg-blue-600 px-6 py-3 rounded-xl">
    Démarrer diffusion
  </button>
  
  <textarea id="offer" class="w-full h-40 bg-zinc-900 p-4 rounded-xl" placeholder="SDP à envoyer au viewer"></textarea>
  
  <textarea id="answer" class="w-full h-40 bg-zinc-900 p-4 rounded-xl" placeholder="Coller la réponse du viewer"></textarea>
  
  <button id="connect" class="bg-green-600 px-6 py-3 rounded-xl">
    Connecter
  </button>
  
  <script>
    const pc = new RTCPeerConnection();
    
    pc.onicecandidate = e => {
      if (!e.candidate) {
        offer.value = JSON.stringify(pc.localDescription);
      }
    };
    
    document.getElementById("start").onclick = async () => {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      stream.getTracks().forEach(t => pc.addTrack(t, stream));
      
      const offerDesc = await pc.createOffer();
      await pc.setLocalDescription(offerDesc);
    };
    
    document.getElementById("connect").onclick = async () => {
      const ans = JSON.parse(answer.value);
      await pc.setRemoteDescription(ans);
    };
  </script>
  
</body>

</html>
