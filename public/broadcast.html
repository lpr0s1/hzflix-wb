<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<title>Diffuseur écran</title>
</head>
<body class="bg-black flex flex-col items-center justify-center h-screen p-6 space-y-4">
<h1 class="text-white text-2xl font-bold">Diffuseur d'écran</h1>
<button id="start" class="bg-blue-600 px-6 py-3 rounded-xl text-lg">Démarrer diffusion</button>
<p class="text-white" id="peerId"></p>

<script>
const peer = new Peer(); // PeerJS cloud server gratuit

peer.on('open', id => {
  document.getElementById('peerId').innerText = `Votre ID : ${id}\nEnvoyez-le au viewer.`;
});

document.getElementById('start').onclick = async () => {
  const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });

  // Garde un objet pour tous les viewers
  const calls = {};

  // Quand un viewer se connecte automatiquement
  peer.on('call', call => {
    call.answer(stream); // Envoie le flux d'écran
    calls[call.peer] = call;
    console.log(`Viewer connecté : ${call.peer}`);
  });
};
</script>
</body>
</html>
